<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HudumaLink — Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <div class="logo-circle">RMS</div>
      <h1>HudumaLink</h1>
      <p class="subtitle">Referral management system</p>

      <form>
        <label for="email">Work email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="name@opm.gov.ug"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
        />

        <button type="submit">Log in</button>
      </form>

      <a href="#" class="forgot-link">Forgot password?</a>

      <div class="org-footer">
        <span>Organization</span>
        <p>OPM · UNHCR · Partner NGOs</p>
      </div>
    </div>
  </body>
</html>
