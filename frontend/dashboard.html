<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HudumaLink — Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard-body">
    <aside class="dashboard-sidebar">
      <div class="dashboard-brand">
        <span class="dashboard-logo-dot"></span>
        <span>HudumaLink</span>
      </div>

      <nav class="dashboard-nav">
        <a href="dashboard.html" class="dashboard-nav-item active">Dashboard</a>
        <a href="referrals.html" class="dashboard-nav-item">Referrals</a>
        <a href="referral-new.html" class="dashboard-nav-item">New Referral</a>
        <a href="partners.html" class="dashboard-nav-item">Partners / NGOs</a>
        <a href="#" class="dashboard-nav-item">Reports</a>
        <a href="#" class="dashboard-nav-item">Settings</a>
      </nav>

      <div class="dashboard-user">
        <span class="dashboard-avatar">G</span>
        <div>
          <p class="dashboard-user-name">Grace A.</p>
          <p class="dashboard-user-role">OPM · Case worker</p>
        </div>
      </div>
    </aside>

    <main class="dashboard-main">
      <div class="ref-sticky-block">
        <header class="dashboard-topbar">
          <div class="dashboard-topbar-left">
            <h1>Dashboard</h1>
            <p class="dashboard-subtitle">OPM · Kyangwali</p>
          </div>

          <div class="dashboard-topbar-right">
            <input
              type="text"
              id="dash-search"
              class="dashboard-search"
              placeholder="Search referral ID... (press Enter)"
            />
            <select id="dash-filter" class="dashboard-filter" aria-label="Quick filter">
              <option value="">Filter: All</option>
              <option value="status=DRAFT">Draft</option>
              <option value="status=SUBMITTED">Submitted</option>
              <option value="status=RECEIVED">Received</option>
              <option value="status=ACCEPTED">Accepted</option>
              <option value="status=IN_PROGRESS">In Progress</option>
              <option value="status=RESOLVED">Resolved</option>
              <option value="status=CLOSED">Closed</option>
              <option value="status=REJECTED">Rejected</option>
              <option value="priority=URGENT">Urgent priority</option>
              <option value="priority=HIGH">High priority</option>
              <option value="category=PROTECTION">Protection</option>
              <option value="category=HEALTH">Health</option>
              <option value="category=SHELTER">Shelter</option>
            </select>
            <button class="dashboard-bell" aria-label="Notifications">
              🔔<span class="dashboard-badge">3</span>
            </button>
            <span class="dashboard-avatar small">G</span>
          </div>
        </header>
      </div>

      <!-- 4 STAT CARDS — MATCHES SRS 15.2 — LIVE -->
      <section class="dashboard-stats">
        <div class="dashboard-stat-card total">
          <p class="dashboard-stat-label">Total referrals</p>
          <p class="dashboard-stat-number" id="stat-total">—</p>
        </div>
        <div class="dashboard-stat-card pending">
          <p class="dashboard-stat-label">Pending</p>
          <p class="dashboard-stat-number" id="stat-pending">—</p>
        </div>
        <div class="dashboard-stat-card inprogress">
          <p class="dashboard-stat-label">In progress</p>
          <p class="dashboard-stat-number" id="stat-inprogress">—</p>
        </div>
        <div class="dashboard-stat-card closed">
          <p class="dashboard-stat-label">Closed</p>
          <p class="dashboard-stat-number" id="stat-closed">—</p>
        </div>
      </section>

      <!-- RECENT REFERRALS — MATCHES SRS 15.2 — LIVE -->
      <section class="dashboard-cases">
        <h2>Recent referrals</h2>

        <div class="dashboard-case-head">
          <span>REF ID</span>
          <span>Status</span>
          <span>Date</span>
          <span>Organization</span>
        </div>

        <div id="dashboard-recent"></div>
      </section>
    </main>

    <script src="toast.js"></script>
    <script src="mock-organizations.js"></script>
    <script src="mock-referrals.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
