<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HudumaLink — Referrals</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-body">

  <aside class="dashboard-sidebar">
    <div class="dashboard-brand">
      <span class="dashboard-logo-dot"></span>
      <span>HudumaLink</span>
    </div>

    <nav class="dashboard-nav">
      <a href="dashboard.html" class="dashboard-nav-item">Dashboard</a>
      <a href="referrals.html" class="dashboard-nav-item active">Referrals</a>
      <a href="referral-new.html" class="dashboard-nav-item">New Referral</a>
      <a href="#" class="dashboard-nav-item">Partners / NGOs</a>
      <a href="#" class="dashboard-nav-item">Reports</a>
      <a href="#" class="dashboard-nav-item">Settings</a>
    </nav>

    <div class="dashboard-user">
      <span class="dashboard-avatar">G</span>
      <div>
        <p class="dashboard-user-name">Grace A.</p>
        <p class="dashboard-user-role">OPM · Case worker</p>
      </div>
    </div>
  </aside>

  <main class="dashboard-main">

    <header class="dashboard-topbar">
      <div class="dashboard-topbar-left">
        <h1>Referrals</h1>
        <p class="dashboard-subtitle">OPM · Kyangwali</p>
      </div>

      <div class="dashboard-topbar-right">
        <input
          type="text"
          id="ref-search"
          class="dashboard-search"
          placeholder="Search by referral ID..."
        />
        <button class="dashboard-bell" aria-label="Notifications">
          🔔<span class="dashboard-badge">3</span>
        </button>
        <span class="dashboard-avatar small">G</span>
      </div>
    </header>

    <!-- TABS — per SRS §65 -->
    <nav class="ref-tabs" id="ref-tabs">
      <button class="ref-tab active" data-tab="all">All</button>
      <button class="ref-tab" data-tab="incoming">Incoming</button>
      <button class="ref-tab" data-tab="outgoing">Outgoing</button>
      <button class="ref-tab" data-tab="closed">Closed</button>
    </nav>

    <!-- FILTER BAR — per SRS §16 -->
    <section class="ref-filterbar">
      <select class="ref-filter" id="filter-status">
        <option value="">All statuses</option>
        <option value="DRAFT">Draft</option>
        <option value="SUBMITTED">Submitted</option>
        <option value="RECEIVED">Received</option>
        <option value="ACCEPTED">Accepted</option>
        <option value="REJECTED">Rejected</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="ONWARD_REFERRED">Onward Referred</option>
        <option value="RESOLVED">Resolved</option>
        <option value="CLOSED">Closed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>

      <select class="ref-filter" id="filter-priority">
        <option value="">All priorities</option>
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
        <option value="URGENT">Urgent</option>
      </select>

      <select class="ref-filter" id="filter-category">
        <option value="">All categories</option>
        <option value="PROTECTION">Protection</option>
        <option value="HEALTH">Health</option>
        <option value="EDUCATION">Education</option>
        <option value="LIVELIHOOD">Livelihood</option>
        <option value="SHELTER">Shelter</option>
        <option value="OTHER">Other</option>
      </select>

      <a href="referral-new.html" class="ref-new-btn">+ New Referral</a>
    </section>

    <!-- TABLE HEADER -->
    <div class="ref-table-head">
      <span>REF ID</span>
      <span>STATUS</span>
      <span>PRIORITY</span>
      <span>CATEGORY</span>
      <span>RECEIVING ORG</span>
      <span>ASSIGNED</span>
      <span>DATE</span>
    </div>

    <!-- ROWS RENDERED BY JS -->
    <div id="ref-table-body"></div>

    <!-- EMPTY STATE -->
    <p id="ref-empty" class="ref-empty" hidden>No referrals match your filters.</p>

  </main>

  <script src="mock-referrals.js"></script>
  <script src="referrals.js"></script>
</body>
</html>
